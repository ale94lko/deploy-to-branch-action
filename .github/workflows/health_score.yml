name: Repo Health Score Badge
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Job to deploy badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ale94lko/repo-health-score

      - name: Get Repo Health Score Badge
        uses: ale94lko/repo-health-score@main

      - name: Deploy badge
        uses: ale94lko/deploy-to-branch-action@main
        with:
          folder: dist
          branch: output
          commit-message: Update health score badge
          single-commit: true
          repository: ale94lko/deploy-to-branch-action
