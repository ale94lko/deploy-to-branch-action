name: Bug report
description: Create a report to help us improve
title: "Bug: "
labels: ['type: Bug']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you begin, **please ensure that there are no [existing issues](https://github.com/ale94lko/deploy-to-branch-action/issues), whether still open or closed, related to your report**.
        If there is, your report will be closed promptly.
        ---

  - type: input
    id: action-version
    attributes:
      label: Action version
      description: |
        e.g. v1.0.0
        If you are not using the [latest release](https://github.com/ale94lko/deploy-to-branch-action/releases), please check whether the problem still occurs there.
    validations:
      required: true

  - type: input
    id: folder
    attributes:
      label: Folder
      description: Value passed to the `folder` input
      placeholder: dist
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Target branch
      description: Value passed to the `branch` input
      placeholder: gh-pages
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Output
      description: What do you expect to happen instead of this bug?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Workflow logs? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
