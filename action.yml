name: 'Deploy to Branch'
description: 'Deploy the content of a folder to a branch'
author: 'Fidel Alejandro Fernandez Arias'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  folder:
    description: 'Folder whose contents will be deployed to the target branch'
    required: true
  branch:
    description: 'Target branch to deploy to'
    required: false
    default: 'gh-pages'
  token:
    description: 'GitHub token used to push to the repository'
    required: false
    default: ${{ github.token }}
  commit-message:
    description: 'Commit message for the deployment commit'
    required: false
    default: 'Deploy from GitHub Actions'
  git-user-name:
    description: 'Git user.name for the deployment commit'
    required: false
    default: 'github-actions[bot]'
  git-user-email:
    description: 'Git user.email for the deployment commit'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  clean:
    description: 'Remove existing files on the target branch before deploying'
    required: false
    default: 'true'
  force:
    description: 'Force-push the deployment branch'
    required: false
    default: 'true'
  single-commit:
    description: 'Keep only a single orphan commit on the target branch'
    required: false
    default: 'false'
  repository:
    description: 'Repository to deploy to (owner/repo). Defaults to the current repository'
    required: false
    default: ${{ github.repository }}
  remote-url:
    description: 'Optional override for the git remote URL (GitHub Enterprise or local testing)'
    required: false
    default: ''

outputs:
  commit-hash:
    description: 'SHA of the deployment commit'
    value: ${{ steps.deploy.outputs.commit-hash }}
  deployed:
    description: 'Whether a new deployment commit was pushed (true/false)'
    value: ${{ steps.deploy.outputs.deployed }}

runs:
  using: 'composite'
  steps:
    - name: Deploy folder to branch
      id: deploy
      shell: bash
      env:
        INPUT_FOLDER: ${{ inputs.folder }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_CLEAN: ${{ inputs.clean }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_SINGLE_COMMIT: ${{ inputs.single-commit }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REMOTE_URL: ${{ inputs.remote-url }}
      run: bash "${{ github.action_path }}/src/deploy.sh"
